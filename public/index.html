<!DOCTYPE html>
<html lang="pt">
<head>
	<meta charset="UTF-8" />

	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0"
	/>

	<meta
		name="theme-color"
		content="#08111f"
	/>

	<meta
		name="description"
		content="Nexora AI — sua inteligência para estudar, criar e pesquisar."
	/>

	<link
		rel="manifest"
		href="/manifest.json"
	/>

	<title>Nexora AI</title>

	<style>
		:root {
			--bg: #08111f;
			--surface: #0d1929;
			--surface-2: #111f32;
			--surface-3: #17283e;

			--primary: #38bdf8;
			--primary-dark: #0ea5e9;

			--text: #f8fafc;
			--muted: #94a3b8;
			--border: #263a55;

			--user: #075985;
			--assistant: transparent;
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		html,
		body {
			width: 100%;
			height: 100%;
			overflow: hidden;
		}

		body {
			font-family:
				-apple-system,
				BlinkMacSystemFont,
				"Segoe UI",
				Roboto,
				Arial,
				sans-serif;

			background: var(--bg);
			color: var(--text);
		}

		button,
		textarea {
			font-family: inherit;
		}

		/* =====================================================
		   ENTRADA NEXORA
		===================================================== */

		.nexora-intro {
			position: fixed;
			inset: 0;

			z-index: 999999;

			display: flex;
			align-items: center;
			justify-content: center;

			background:
				radial-gradient(
					circle at center,
					#102541 0%,
					#08111f 55%,
					#050b14 100%
				);

			opacity: 1;

			transition:
				opacity 0.45s ease,
				visibility 0.45s ease;
		}

		.nexora-intro.hide {
			opacity: 0;
			visibility: hidden;
			pointer-events: none;
		}

		.nexora-intro-content {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;

			animation:
				nexoraIntroEnter
				0.7s
				cubic-bezier(.22,1,.36,1)
				both;
		}

		.nexora-intro-logo {
			position: relative;

			width: 104px;
			height: 104px;

			display: flex;
			align-items: center;
			justify-content: center;

			border-radius: 30px;

			background:
				linear-gradient(
					135deg,
					#38bdf8 0%,
					#6366f1 100%
				);

			box-shadow:
				0 0 0 1px rgba(255,255,255,0.08),
				0 0 35px rgba(56,189,248,0.35),
				0 20px 60px rgba(0,0,0,0.45);

			animation:
				nexoraLogoFloat
				1.8s
				ease-in-out
				infinite;
		}

		.nexora-intro-logo::before {
			content: "";

			position: absolute;
			inset: -12px;

			border-radius: 36px;

			border: 1px solid
				rgba(56,189,248,0.35);

			animation:
				nexoraPulse
				1.8s
				ease-out
				infinite;
		}

		.nexora-intro-logo::after {
			content: "";

			position: absolute;
			inset: -35px;

			border-radius: 50%;

			background:
				radial-gradient(
					circle,
					rgba(56,189,248,0.18),
					transparent 65%
				);

			pointer-events: none;
		}

		.nexora-logo-n {
			position: relative;
			z-index: 2;

			color: white;

			font-size: 52px;
			font-weight: 900;

			line-height: 1;

			letter-spacing: -4px;

			text-shadow:
				0 4px 20px
				rgba(0,0,0,0.25);
		}

		.nexora-logo-star {
			position: absolute;

			top: 13px;
			right: 12px;

			z-index: 3;

			color: white;

			font-size: 25px;

			line-height: 1;

			transform:
				rotate(12deg);

			filter:
				drop-shadow(
					0 0 8px
					rgba(255,255,255,0.8)
				);

			animation:
				nexoraStar
				1.4s
				ease-in-out
				infinite;
		}

		.nexora-intro-name {
			margin-top: 28px;

			color: white;

			font-size: 30px;
			font-weight: 800;

			letter-spacing: 4px;

			text-shadow:
				0 0 25px
				rgba(56,189,248,0.3);
		}

		.nexora-intro-status {
			margin-top: 10px;

			color: #94a3b8;

			font-size: 13px;

			letter-spacing: 0.4px;

			animation:
				nexoraStatus
				1.2s
				ease-in-out
				infinite;
		}

		.nexora-dots::after {
			content: "";

			animation:
				nexoraDots
				1.2s
				steps(4,end)
				infinite;
		}

		@keyframes nexoraIntroEnter {
			from {
				opacity: 0;
				transform:
					scale(0.78)
					translateY(14px);
			}

			to {
				opacity: 1;
				transform:
					scale(1)
					translateY(0);
			}
		}

		@keyframes nexoraLogoFloat {
			0%,
			100% {
				transform:
					translateY(0)
					scale(1);
			}

			50% {
				transform:
					translateY(-5px)
					scale(1.015);
			}
		}

		@keyframes nexoraPulse {
			0% {
				opacity: 0.8;
				transform: scale(0.9);
			}

			100% {
				opacity: 0;
				transform: scale(1.18);
			}
		}

		@keyframes nexoraStar {
			0%,
			100% {
				transform:
					rotate(12deg)
					scale(1);
				opacity: 0.85;
			}

			50% {
				transform:
					rotate(25deg)
					scale(1.18);
				opacity: 1;
			}
		}

		@keyframes nexoraStatus {
			0%,
			100% {
				opacity: 0.55;
			}

			50% {
				opacity: 1;
			}
		}

		@keyframes nexoraDots {
			0% {
				content: "";
			}

			25% {
				content: ".";
			}

			50% {
				content: "..";
			}

			75%,
			100% {
				content: "...";
			}
		}

		/* =====================================================
		   APP — ECRÃ COMPLETO
		===================================================== */

		.app {
			width: 100%;
			height: 100dvh;

			display: flex;
			flex-direction: column;

			background: var(--bg);
		}

		/* =====================================================
		   HEADER
		===================================================== */

		header {
			flex: 0 0 auto;

			display: flex;
			align-items: center;
			justify-content: center;

			padding: 14px 60px 10px;

			position: relative;
		}

		.logo {
			width: 42px;
			height: 42px;

			display: flex;
			align-items: center;
			justify-content: center;

			border-radius: 13px;

			background: linear-gradient(
				135deg,
				#38bdf8,
				#6366f1
			);

			color: white;
			font-size: 22px;
			font-weight: 800;

			margin-right: 10px;
		}

		.header-brand {
			display: flex;
			align-items: center;
		}

		h1 {
			font-size: 22px;
			letter-spacing: 0.8px;
			color: var(--text);
		}

		.subtitle {
			display: none;
		}

		/* =====================================================
		   MODOS
		===================================================== */

		.modes {
			flex: 0 0 auto;

			display: flex;
			justify-content: center;

			gap: 8px;

			padding: 5px 12px 12px;

			overflow-x: auto;
			scrollbar-width: none;
		}

		.modes::-webkit-scrollbar {
			display: none;
		}

		.mode {
			flex: 0 0 auto;

			display: flex;
			align-items: center;
			gap: 7px;

			padding: 9px 14px;

			border: 1px solid var(--border);
			border-radius: 999px;

			background: var(--surface);
			color: var(--muted);

			cursor: pointer;

			transition:
				background 0.2s ease,
				border-color 0.2s ease,
				color 0.2s ease,
				transform 0.2s ease;
		}

		.mode:hover {
			border-color: var(--primary);
			color: var(--text);
		}

		.mode-icon {
			font-size: 18px;
		}

		.mode-title {
			font-weight: 700;
			font-size: 13px;
		}

		/* =====================================================
		   CHAT
		===================================================== */

		.chat-container {
			flex: 1 1 auto;

			width: 100%;
			min-height: 0;

			display: flex;
			flex-direction: column;

			background: var(--bg);

			overflow: hidden;
		}

		.chat-messages {
			flex: 1 1 auto;

			width: 100%;
			max-width: 900px;

			margin: 0 auto;

			overflow-y: auto;

			padding:
				20px
				20px
				150px;

			scroll-behavior: smooth;

			scrollbar-width: thin;
			scrollbar-color:
				#263a55
				transparent;
		}

		.message {
			width: fit-content;
			max-width: min(760px, 90%);

			margin-bottom: 18px;

			padding: 13px 16px;

			border-radius: 18px;

			line-height: 1.6;

			animation:
				messageAppear 0.18s ease;
		}

		@keyframes messageAppear {
			from {
				opacity: 0;
				transform: translateY(4px);
			}

			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.message p {
			white-space: pre-line;
			overflow-wrap: anywhere;
		}

		.user-message {
			margin-left: auto;

			background: var(--user);

			border-bottom-right-radius: 6px;
		}

		.assistant-message {
			margin-right: auto;

			background: var(--assistant);

			border: 1px solid transparent;

			border-bottom-left-radius: 6px;
		}

		/* =====================================================
		   INDICADOR
		===================================================== */

		.typing-indicator {
			display: none;

			width: 100%;
			max-width: 900px;

			margin: 0 auto;

			padding:
				4px
				20px
				10px;

			color: var(--primary);

			font-size: 13px;
		}

		.typing-indicator.visible {
			display: block;
		}

		/* =====================================================
		   ÁREA DE INPUT
		===================================================== */

		.message-input {
			flex: 0 0 auto;

			width: 100%;

			padding:
				10px
				16px
				calc(12px + env(safe-area-inset-bottom));

			background:
				linear-gradient(
					to bottom,
					transparent,
					var(--bg) 25%
				);
		}

		.input-inner {
			width: 100%;
			max-width: 850px;

			margin: 0 auto;

			display: flex;
			align-items: flex-end;
			gap: 8px;

			padding: 8px;

			background: var(--surface-2);

			border: 1px solid var(--border);
			border-radius: 18px;

			box-shadow:
				0 8px 30px
				rgba(0, 0, 0, 0.25);
		}

		#user-input {
			flex: 1;

			min-height: 44px;
			max-height: 150px;

			padding: 11px 12px;

			border: none;
			outline: none;

			background: transparent;
			color: var(--text);

			font-size: 16px;

			resize: none;

			line-height: 1.4;
		}

		#user-input::placeholder {
			color: #64748b;
		}

		#send-button {
			flex: 0 0 auto;

			width: 44px;
			height: 44px;

			border: none;
			border-radius: 13px;

			background: var(--primary);
			color: #062033;

			font-size: 18px;
			font-weight: 800;

			cursor: pointer;

			transition:
				background 0.2s ease,
				transform 0.2s ease;
		}

		#send-button:hover {
			background: var(--primary-dark);
			color: white;

			transform: scale(1.03);
		}

		#send-button:disabled {
			opacity: 0.45;
			cursor: not-allowed;

			transform: none;
		}

		/* =====================================================
		   FOOTER
		===================================================== */

		footer {
			flex: 0 0 auto;

			text-align: center;

			padding:
				0
				10px
				8px;

			color: #64748b;

			font-size: 10px;
		}

		/* =====================================================
		   MOBILE
		===================================================== */

		@media (max-width: 600px) {

			.nexora-intro-logo {
				width: 88px;
				height: 88px;

				border-radius: 26px;
			}

			.nexora-logo-n {
				font-size: 44px;
			}

			.nexora-logo-star {
				top: 10px;
				right: 10px;
				font-size: 21px;
			}

			.nexora-intro-name {
				font-size: 25px;
				letter-spacing: 3px;
				margin-top: 24px;
			}

			header {
				padding:
					12px
					50px
					8px;
			}

			.logo {
				width: 38px;
				height: 38px;

				border-radius: 11px;

				font-size: 20px;
			}

			h1 {
				font-size: 20px;
			}

			.modes {
				justify-content: flex-start;

				padding:
					4px
					10px
					10px;
			}

			.mode {
				padding:
					8px
					12px;
			}

			.mode-icon {
				font-size: 16px;
			}

			.mode-title {
				font-size: 12px;
			}

			.chat-messages {
				padding:
					16px
					12px
					135px;
			}

			.message {
				max-width: 92%;

				padding:
					12px
					14px;

				border-radius: 16px;
			}

			.typing-indicator {
				padding:
					4px
					12px
					8px;
			}

			.message-input {
				padding:
					7px
					10px
					calc(
						8px +
						env(safe-area-inset-bottom)
					);
			}

			.input-inner {
				border-radius: 17px;
			}

			#user-input {
				font-size: 16px;
			}

			#send-button {
				width: 42px;
				height: 42px;
			}

			footer {
				display: none;
			}
		}
	</style>
</head>

			</div>

	<div class="app">

		================================================== -->

				<div class="logo">
					N
				</div>
