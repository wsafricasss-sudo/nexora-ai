<!DOCTYPE html>
<html lang="pt">
<head>
	<meta charset="UTF-8" />

	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0, viewport-fit=cover"
	/>

	<meta
		name="theme-color"
		content="#08111f"
	/>

	<meta
		name="description"
		content="Nexora AI — sua inteligência para estudar, criar e pesquisar."
	/>

	<meta
		name="mobile-web-app-capable"
		content="yes"
	/>

	<meta
		name="apple-mobile-web-app-capable"
		content="yes"
	/>

	<meta
		name="apple-mobile-web-app-status-bar-style"
		content="black-translucent"
	/>

	<meta
		name="apple-mobile-web-app-title"
		content="Nexora AI"
	/>

	<link
		rel="manifest"
		href="/manifest.json"
	/>

	<link
		rel="icon"
		type="image/png"
		sizes="192x192"
		href="/icon-192.png"
	/>

	<link
		rel="apple-touch-icon"
		sizes="192x192"
		href="/icon-192.png"
	/>

	<title>Nexora AI</title>

	<style>
		:root {
			--bg: #08111f;
			--card: #0f1b2d;
			--card-light: #14243a;
			--primary: #38bdf8;
			--primary-dark: #0ea5e9;
			--text: #f8fafc;
			--muted: #94a3b8;
			--border: #263a55;
			--user: #075985;
			--assistant: #132238;
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		html,
		body {
			width: 100%;
			min-height: 100%;
		}

		body {
			font-family:
				-apple-system,
				BlinkMacSystemFont,
				"Segoe UI",
				Roboto,
				Arial,
				sans-serif;

			background: var(--bg);
			color: var(--text);
			min-height: 100vh;

			-webkit-font-smoothing: antialiased;
		}

		button,
		textarea {
			font: inherit;
		}

		button {
			-webkit-tap-highlight-color: transparent;
		}

		.app {
			width: 100%;
			max-width: 900px;
			margin: auto;
			padding: 20px;
		}

		header {
			text-align: center;
			padding: 25px 10px;
		}

		.logo {
			width: 58px;
			height: 58px;
			margin: 0 auto 12px;

			display: flex;
			align-items: center;
			justify-content: center;

			border-radius: 18px;

			background: linear-gradient(
				135deg,
				#38bdf8,
				#6366f1
			);

			color: white;
			font-size: 30px;
			font-weight: 800;
		}

		h1 {
			font-size: 42px;
			letter-spacing: 1px;
			color: var(--primary);
		}

		.subtitle {
			margin-top: 8px;
			color: var(--muted);
			font-size: 17px;
		}

		.modes {
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			gap: 10px;
			margin-bottom: 16px;
		}

		.mode {
			padding: 15px 8px;

			border: 1px solid var(--border);
			border-radius: 14px;

			background: var(--card);
			color: var(--text);

			cursor: pointer;
			transition: 0.2s;
		}

		.mode:hover {
			border-color: var(--primary);
			transform: translateY(-1px);
		}

		.mode.active {
			border-color: var(--primary);
			box-shadow: 0 0 0 1px var(--primary);
		}

		.mode-icon {
			display: block;
			font-size: 26px;
			margin-bottom: 6px;
		}

		.mode-title {
			font-weight: 700;
			font-size: 14px;
		}

		.chat-container {
			display: flex;
			flex-direction: column;

			height: calc(100vh - 330px);
			min-height: 400px;

			border: 1px solid var(--border);
			border-radius: 18px;

			overflow: hidden;

			background: var(--card);
		}

		.chat-messages {
			flex: 1;
			overflow-y: auto;
			padding: 18px;
			scroll-behavior: smooth;
		}

		.message {
			margin-bottom: 14px;
			padding: 13px 15px;

			border-radius: 15px;

			max-width: 82%;

			line-height: 1.55;
		}

		.message p {
			white-space: pre-line;
			overflow-wrap: anywhere;
		}

		.user-message {
			background: var(--user);
			margin-left: auto;
			border-bottom-right-radius: 5px;
		}

		.assistant-message {
			background: var(--assistant);
			border: 1px solid var(--border);
			border-bottom-left-radius: 5px;
		}

		.message-input {
			display: flex;
			gap: 9px;

			padding: 12px;

			border-top: 1px solid var(--border);
			background: var(--card-light);
		}

		#user-input {
			flex: 1;

			min-height: 48px;
			max-height: 150px;

			padding: 13px;

			border: 1px solid var(--border);
			border-radius: 12px;

			background: var(--bg);
			color: var(--text);

			font-family: inherit;
			font-size: 16px;

			resize: none;
			outline: none;
		}

		#user-input:focus {
			border-color: var(--primary);
		}

		#user-input::placeholder {
			color: #64748b;
		}

		#send-button {
			min-width: 80px;

			border: none;
			border-radius: 12px;

			background: var(--primary);
			color: #062033;

			font-weight: 700;
			cursor: pointer;
		}

		#send-button:hover {
			background: var(--primary-dark);
			color: white;
		}

		#send-button:disabled {
			opacity: 0.5;
			cursor: not-allowed;
		}

		.typing-indicator {
			display: none;

			padding: 10px 18px;

			color: var(--primary);
			font-size: 14px;
		}

		.typing-indicator.visible {
			display: block;
		}

		footer {
			text-align: center;
			padding: 15px;

			color: var(--muted);
			font-size: 12px;
		}

		@media (max-width: 600px) {
			.app {
				padding: 10px;
			}

			header {
				padding: 20px 8px;
			}

			h1 {
				font-size: 34px;
			}

			.subtitle {
				font-size: 15px;
			}

			.modes {
				gap: 6px;
			}

			.mode {
				padding: 12px 5px;
			}

			.mode-icon {
				font-size: 22px;
			}

			.mode-title {
				font-size: 12px;
			}

			.chat-container {
				height: calc(100vh - 300px);
				min-height: 380px;
			}

			.message {
				max-width: 90%;
			}

			#send-button {
				min-width: 65px;
			}
		}
	</style>
</head>

<body>

	<div class="app">

		<header>
			<div class="logo">N</div>

			<h1>NEXORA AI</h1>

			<div class="subtitle">
				Sua inteligência para estudar, criar e pesquisar.
			</div>
		</header>

		<div class="modes">

			<button
				class="mode active"
				data-mode="estudar"
				type="button"
			>
				<span class="mode-icon">📚</span>
				<span class="mode-title">ESTUDAR</span>
			</button>

			<button
				class="mode"
				data-mode="negocios"
				type="button"
			>
				<span class="mode-icon">💼</span>
				<span class="mode-title">NEGÓCIOS</span>
			</button>

			<button
				class="mode"
				data-mode="pesquisa"
				type="button"
			>
				<span class="mode-icon">🔎</span>
				<span class="mode-title">PESQUISA</span>
			</button>

		</div>

		<div class="chat-container">

			<div
				id="chat-messages"
				class="chat-messages"
			>
				<div class="message assistant-message">
					<p>
						Olá! 👋 Eu sou a Nexora AI.

						Você está no modo Estudar.

						Posso ajudar com matérias,
						explicações, exercícios,
						resumos e preparação para provas.

						Como posso ajudar?
					</p>
				</div>
			</div>

			<div
				class="typing-indicator"
				id="typing-indicator"
			>
				🤖 Nexora está a analisar...
			</div>

			<div class="message-input">

				<textarea
					id="user-input"
					placeholder="Escreva sua pergunta..."
					rows="1"
					autofocus
				></textarea>

				<button
					id="send-button"
					type="button"
				>
					Enviar
				</button>

			</div>

		</div>

		<footer>
			Nexora AI • Powered by Cloudflare Workers AI
		</footer>

	</div>

	<script src="/chat.js"></script>

	<script>
		/*
		 * Registra o Service Worker.
		 * Isto é o que permite que a Nexora
		 * funcione como PWA/aplicativo.
		 */
		if ("serviceWorker" in navigator) {
			window.addEventListener("load", async () => {
				try {
					const registration =
						await navigator.serviceWorker.register("/sw.js", {
							scope: "/"
						});

					console.log(
						"Nexora AI Service Worker registrado:",
						registration.scope
					);
				} catch (error) {
					console.error(
						"Erro ao registrar o Service Worker:",
						error
					);
				}
			});
		}
	</script>

</body>
</html>
