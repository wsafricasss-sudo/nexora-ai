<!DOCTYPE html>
<html lang="pt">
<head>
	<meta charset="UTF-8" />

	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0"
	/>

	<meta
		name="theme-color"
		content="#08111f"
	/>

	<meta
		name="description"
		content="Nexora AI — sua inteligência para estudar, criar e pesquisar."
	/>

	<link
		rel="manifest"
		href="/manifest.json"
	/>

	<title>Nexora AI</title>

	<style>
		:root {
			--bg: #08111f;
			--card: #0f1b2d;
			--card-light: #14243a;
			--primary: #38bdf8;
			--primary-dark: #0ea5e9;
			--text: #f8fafc;
			--muted: #94a3b8;
			--border: #263a55;
			--user: #075985;
			--assistant: #132238;
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		html,
		body {
			min-height: 100%;
		}

		body {
			font-family:
				-apple-system,
				BlinkMacSystemFont,
				"Segoe UI",
				Roboto,
				Arial,
				sans-serif;

			background: var(--bg);
			color: var(--text);
			min-height: 100vh;
		}

		button,
		textarea,
		input {
			font-family: inherit;
		}

		.app {
			width: 100%;
			max-width: 900px;
			margin: auto;
			padding: 20px;
		}

		/* =====================================================
		   HEADER
		===================================================== */

		header {
			text-align: center;
			padding: 25px 10px;
		}

		.logo {
			width: 58px;
			height: 58px;
			margin: 0 auto 12px;

			display: flex;
			align-items: center;
			justify-content: center;

			border-radius: 18px;

			background: linear-gradient(
				135deg,
				#38bdf8,
				#6366f1
			);

			color: white;
			font-size: 30px;
			font-weight: 800;
		}

		h1 {
			font-size: 42px;
			letter-spacing: 1px;
			color: var(--primary);
		}

		.subtitle {
			margin-top: 8px;
			color: var(--muted);
			font-size: 17px;
		}

		/* =====================================================
		   MODOS
		===================================================== */

		.modes {
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			gap: 10px;
			margin-bottom: 16px;
		}

		.mode {
			padding: 15px 8px;

			border: 1px solid var(--border);
			border-radius: 14px;

			background: var(--card);
			color: var(--text);

			cursor: pointer;
			transition: 0.2s;
		}

		.mode:hover {
			border-color: var(--primary);
			transform: translateY(-1px);
		}

		.mode-icon {
			display: block;
			font-size: 26px;
			margin-bottom: 6px;
		}

		.mode-title {
			font-weight: 700;
			font-size: 14px;
		}

		/* =====================================================
		   CHAT
		===================================================== */

		.chat-container {
			display: flex;
			flex-direction: column;

			height: calc(100vh - 330px);
			min-height: 400px;

			border: 1px solid var(--border);
			border-radius: 18px;

			overflow: hidden;

			background: var(--card);
		}

		.chat-messages {
			flex: 1;
			overflow-y: auto;
			padding: 18px;
		}

		.message {
			margin-bottom: 14px;
			padding: 13px 15px;

			border-radius: 15px;

			max-width: 82%;

			line-height: 1.55;
		}

		.message p {
			white-space: pre-line;
			overflow-wrap: anywhere;
		}

		.user-message {
			background: var(--user);
			margin-left: auto;
			border-bottom-right-radius: 5px;
		}

		.assistant-message {
			background: var(--assistant);
			border: 1px solid var(--border);
			border-bottom-left-radius: 5px;
		}

		/* =====================================================
		   IMAGEM NAS MENSAGENS
		===================================================== */

		.message-image {
			display: block;

			width: min(100%, 300px);
			max-height: 350px;

			object-fit: contain;

			margin-bottom: 10px;

			border-radius: 12px;

			border: 1px solid rgba(
				255,
				255,
				255,
				0.12
			);
		}

		/* =====================================================
		   PREVIEW DA IMAGEM
		===================================================== */

		.attachment-preview {
			display: none;

			align-items: center;
			gap: 10px;

			padding: 10px 12px;

			border-top: 1px solid var(--border);

			background: var(--card-light);
		}

		.attachment-preview.visible {
			display: flex;
		}

		.attachment-preview img {
			width: 58px;
			height: 58px;

			flex: 0 0 58px;

			object-fit: cover;

			border-radius: 10px;

			border: 1px solid var(--border);
		}

		.attachment-preview-info {
			flex: 1;
			min-width: 0;
		}

		.attachment-preview-name {
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;

			font-size: 13px;
		}

		.attachment-preview-label {
			margin-top: 3px;

			color: var(--muted);
			font-size: 11px;
		}

		.attachment-remove {
			width: 36px;
			height: 36px;

			flex: 0 0 36px;

			border: none;
			border-radius: 9px;

			background: transparent;
			color: var(--muted);

			font-size: 22px;

			cursor: pointer;
		}

		.attachment-remove:hover {
			background: var(--bg);
			color: white;
		}

		/* =====================================================
		   INPUT
		===================================================== */

		.message-input {
			display: flex;
			align-items: center;
			gap: 8px;

			padding: 12px;

			border-top: 1px solid var(--border);
			background: var(--card-light);
		}

		.media-button {
			width: 50px;
			height: 50px;

			flex: 0 0 50px;

			border: 1px solid var(--border);
			border-radius: 12px;

			background: var(--bg);
			color: var(--text);

			font-size: 23px;

			cursor: pointer;
			transition: 0.2s;
		}

		.media-button:hover {
			border-color: var(--primary);
			background: var(--card);
		}

		.media-button:active {
			transform: scale(0.96);
		}

		#user-input {
			flex: 1;

			min-width: 0;

			min-height: 48px;
			max-height: 150px;

			padding: 13px;

			border: 1px solid var(--border);
			border-radius: 12px;

			background: var(--bg);
			color: var(--text);

			font-family: inherit;
			font-size: 16px;

			resize: none;
			outline: none;
		}

		#user-input:focus {
			border-color: var(--primary);
		}

		#user-input::placeholder {
			color: #64748b;
		}

		#send-button {
			min-width: 80px;
			height: 50px;

			border: none;
			border-radius: 12px;

			background: var(--primary);
			color: #062033;

			font-weight: 700;
			cursor: pointer;
		}

		#send-button:hover {
			background: var(--primary-dark);
			color: white;
		}

		#send-button:disabled {
			opacity: 0.5;
			cursor: not-allowed;
		}

		/* =====================================================
		   LOADING
		===================================================== */

		.typing-indicator {
			display: none;

			padding: 10px 18px;

			color: var(--primary);
			font-size: 14px;
		}

		.typing-indicator.visible {
			display: block;
		}

		/* =====================================================
		   FOOTER
		===================================================== */

		footer {
			text-align: center;
			padding: 15px;

			color: var(--muted);
			font-size: 12px;
		}

		/* =====================================================
		   MOBILE
		===================================================== */

		@media (max-width: 600px) {

			.app {
				padding: 10px;
			}

			header {
				padding-top: 45px;
			}

			h1 {
				font-size: 34px;
			}

			.subtitle {
				font-size: 15px;
			}

			.modes {
				gap: 6px;
			}

			.mode {
				padding: 12px 5px;
			}

			.mode-icon {
				font-size: 22px;
			}

			.mode-title {
				font-size: 12px;
			}

			.chat-container {
				height: calc(100vh - 300px);
				min-height: 380px;
			}

			.message {
				max-width: 92%;
			}

			.message-input {
				gap: 6px;
				padding: 8px;
			}

			.media-button {
				width: 46px;
				height: 46px;
				flex-basis: 46px;
				font-size: 21px;
			}

			#send-button {
				min-width: 65px;
				height: 46px;
			}

			#user-input {
				min-height: 46px;
				padding: 11px;
			}
		}
	</style>
</head>

<body>

	<div class="app">

		<header>

			<div class="logo">
				N
			</div>

			<h1>
				NEXORA AI
			</h1>

			<div class="subtitle">
				Sua inteligência para estudar, criar e pesquisar.
			</div>

		</header>

		<!-- =================================================
		     MODOS
		================================================== -->

		<div class="modes">

			<button
				type="button"
				class="mode"
			>
				<span class="mode-icon">
					📚
				</span>

				<span class="mode-title">
					ESTUDAR
				</span>
			</button>

			<button
				type="button"
				class="mode"
			>
				<span class="mode-icon">
					💼
				</span>

				<span class="mode-title">
					NEGÓCIOS
				</span>
			</button>

			<button
				type="button"
				class="mode"
			>
				<span class="mode-icon">
					🔎
				</span>

				<span class="mode-title">
					PESQUISA
				</span>
			</button>

		</div>

		<!-- =================================================
		     CHAT
		================================================== -->

		<div class="chat-container">

			<div
				id="chat-messages"
				class="chat-messages"
			></div>

			<div
				id="typing-indicator"
				class="typing-indicator"
			>
				🤖 Nexora está a analisar...
			</div>

			<!-- PREVIEW -->
			<div
				id="attachment-preview"
				class="attachment-preview"
			></div>

			<!-- =================================================
			     INPUT
			================================================== -->

			<div class="message-input">

				<!-- CÂMERA -->
				<button
					type="button"
					id="camera-button"
					class="media-button"
					title="Tirar foto"
					aria-label="Tirar foto"
				>
					📷
				</button>

				<!-- GALERIA -->
				<button
					type="button"
					id="gallery-button"
					class="media-button"
					title="Escolher da galeria"
					aria-label="Escolher da galeria"
				>
					🖼️
				</button>

				<!-- INPUT DA CÂMERA -->
				<input
					type="file"
					id="camera-input"
					accept="image/*"
					capture="environment"
					hidden
				/>

				<!-- INPUT DA GALERIA -->
				<input
					type="file"
					id="gallery-input"
					accept="image/*"
					hidden
				/>

				<textarea
					id="user-input"
					placeholder="Escreva sua pergunta..."
					rows="1"
					autofocus
				></textarea>

				<button
					id="send-button"
					type="button"
				>
					Enviar
				</button>

			</div>

		</div>

		<footer>
			Nexora AI • Powered by Cloudflare Workers AI
		</footer>

	</div>

	<script src="chat.js"></script>

</body>
</html>
